{{- if .Values.networkPolicy.enabled }}
# Default-deny NetworkPolicy for agent pods: every pod the API starts
# (repo pods, Job pods, persistent-agent pods, assistant agent pods) carries
# `managed-by: optio`; the chart's own pods do not.
# Restricts cluster-internal traffic so a compromised agent pod cannot
# reach PostgreSQL, Redis, or other services directly. Only the Optio
# API service is reachable on the cluster network.
#
# External egress (GitHub, npm registries, AI providers) is allowed on
# ports 443 and 80, except to `networkPolicy.deniedEgressCidrs` (the cloud
# metadata service by default). DNS resolution is allowed on port 53.
{{- $denied := .Values.networkPolicy.deniedEgressCidrs | default list }}
{{- $v4 := list }}
{{- $v6 := list }}
{{- range $denied }}
{{- if contains ":" . }}{{ $v6 = append $v6 . }}{{ else }}{{ $v4 = append $v4 . }}{{ end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-repo-pod-policy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "optio.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      managed-by: optio
  policyTypes:
    - Ingress
    - Egress
  # Deny all ingress — agent pods do not serve traffic.
  # The API communicates with them via kubectl exec (through the K8s API
  # server / kubelet), which is not subject to NetworkPolicy.
  ingress: []
  egress:
    # Allow DNS resolution (kube-dns / CoreDNS)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow access to the Optio API service (credential endpoint, callbacks)
    - to:
        - podSelector:
            matchLabels:
              app: optio-api
      ports:
        - protocol: TCP
          port: {{ .Values.api.port | default 4000 }}
    # Allow HTTPS to external services (GitHub, npm, AI providers, etc.)
    # and HTTP (some registries, mirrors) — but not the metadata service.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
      {{- if $denied }}
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- if $v4 }}
            except:
              {{- toYaml $v4 | nindent 14 }}
            {{- end }}
        - ipBlock:
            cidr: ::/0
            {{- if $v6 }}
            except:
              {{- toYaml $v6 | nindent 14 }}
            {{- end }}
      {{- end }}
{{- end }}
