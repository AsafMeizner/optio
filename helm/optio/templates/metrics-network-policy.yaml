{{- if and .Values.metrics.enabled .Values.metrics.networkPolicy.enabled }}
{{- $mp := .Values.metrics.networkPolicy }}
# Metrics have no sign-in and include repository URLs and activity counts.
# Only the configured monitoring audience and this release's helm-test pod
# may reach metrics.port. This ingress policy applies to the entire API pod;
# the API and web ports remain open to every source.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-api-metrics-policy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "optio.labels" . | nindent 4 }}
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: optio-api
  policyTypes:
    - Ingress
  ingress:
    # The API and the web UI: the ingress, agent pods, probes, as before.
    - ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
        - protocol: TCP
          port: {{ .Values.web.port }}
    # The metrics port: Prometheus and the chart's own check only.
    - from:
        {{- range ($mp.namespaces | default list) }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- with $mp.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - podSelector:
            matchLabels:
              {{- include "optio.metrics.testLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.metrics.port }}
{{- end }}
