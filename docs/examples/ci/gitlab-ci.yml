# Optional example: copy to .gitlab-ci.yml to activate in your repository.
# Configure the variables and File secrets described in README.md.
stages: [check, test, build, deploy]
variables:
  OPTIO_CI_IMAGE: node:26
  OPTIO_POSTGRES_IMAGE: postgres:16-alpine
  OPTIO_REDIS_IMAGE: redis:7-alpine
  OPTIO_DEPLOY_IMAGE: alpine/k8s:1.34.12
  OPTIO_NAMESPACE: optio
  OPTIO_RELEASE: optio
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"
default:
  image: $OPTIO_CI_IMAGE
  before_script:
    - command -v pnpm || npm install -g pnpm@10.34.8
    - . docs/examples/ci/lib.sh && optio_pnpm_install
check:
  stage: check
  script:
    - pnpm format:check
    - pnpm turbo typecheck
    - node --test scripts/selfhost.test.mjs scripts/offline/*.test.mjs scripts/deployment-packaging.test.mjs
    - bash scripts/check-migration-prefixes.sh
chart:
  stage: check
  image: $OPTIO_DEPLOY_IMAGE
  before_script: []
  script:
    - docs/examples/ci/chart.sh

test:
  stage: test
  services:
    - name: $OPTIO_POSTGRES_IMAGE
      alias: postgres
    - name: $OPTIO_REDIS_IMAGE
      alias: redis
  variables:
    POSTGRES_USER: optio
    POSTGRES_PASSWORD: ci-test-password
    POSTGRES_DB: optio_test
    OPTIO_TEST_NO_DOCKER: "1"
    OPTIO_TEST_PG_URL: postgres://optio:ci-test-password@postgres:5432/optio_test
    OPTIO_TEST_REDIS_URL: redis://redis:6379
  script:
    - docs/examples/ci/test.sh unit
    - docs/examples/ci/test.sh integration
    - docs/examples/ci/test.sh e2e
build:
  stage: build
  image: docker:28-cli
  services:
    - name: docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  before_script:
    - apk add --no-cache bash
    - printf '%s' "$OPTIO_REGISTRY_PASSWORD" | docker login "${OPTIO_REGISTRY%%/*}" -u "$OPTIO_REGISTRY_USER" --password-stdin
  script:
    - |
      set --
      if [ -n "${OPTIO_TOOLCHAIN_VERSION:-}" ]; then
        set -- --offline --toolchain-version "$OPTIO_TOOLCHAIN_VERSION"
      fi
      bash scripts/offline/build-images.sh "$CI_COMMIT_SHORT_SHA" --registry "$OPTIO_REGISTRY" --presets --push "$@"
deploy:
  stage: deploy
  image: $OPTIO_DEPLOY_IMAGE
  when: manual
  before_script: []
  script:
    - test -f "$KUBECONFIG" && test -f "$OPTIO_VALUES"
    - |
      helm upgrade --install "$OPTIO_RELEASE" helm/optio --namespace "$OPTIO_NAMESPACE" \
        --create-namespace --set createNamespace=false --values "$OPTIO_VALUES" \
        --set "namespace=$OPTIO_NAMESPACE" \
        --set "api.image.repository=$OPTIO_REGISTRY/optio-api,api.image.tag=$CI_COMMIT_SHORT_SHA" \
        --set "web.image.repository=$OPTIO_REGISTRY/optio-web,web.image.tag=$CI_COMMIT_SHORT_SHA" \
        --set "agent.image.repository=$OPTIO_REGISTRY/optio-agent-base,agent.image.prefix=$OPTIO_REGISTRY/optio-agent-,agent.image.tag=$CI_COMMIT_SHORT_SHA" \
        --wait --timeout 10m
    - docs/examples/ci/smoke.sh "$OPTIO_URL"
